name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Gitea also scans .github/workflows, but its runner cannot reach github.com,
  # and publishing should only happen from the GitHub upstream repo →
  # skip everything if the owner does not match
  build_wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.repository_owner == 'IAI-USTC-Quantum'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # submodules: true fetches extern/qram-simulator (the relative URL
      # resolves to this org's QRAM-Simulator repo on GitHub); fetch-depth: 0
      # lets setuptools-scm read the version
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      # Windows: inject the MSVC environment into cibuildwheel subprocesses (Ninja needs cl)
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-macos*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    if: github.repository_owner == 'IAI-USTC-Quantum'
    steps:
      # checkout must initialize submodules: pyproject's sdist.include packs
      # the extern/qram-simulator contents into the sdist (PyPI requires a
      # self-contained sdist)
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build setuptools-scm
          python -m build --sdist

      - name: Verify sdist is self-contained
        run: |
          tar -tzf dist/pysparq-*.tar.gz | grep -q "SparQ/include/sparse_state_simulator.h" \
            || { echo "ERROR: sdist missing SparQ framework headers"; exit 1; }
          tar -tzf dist/pysparq-*.tar.gz | grep -q "extern/qram-simulator/QRAM/include/qram_circuit_qubit.h" \
            || { echo "ERROR: sdist missing embedded QRAM-Simulator core"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'IAI-USTC-Quantum' && (github.event_name == 'push' || github.event_name == 'release')
    environment:
      name: pypi
      url: https://pypi.org/project/pysparq/

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
