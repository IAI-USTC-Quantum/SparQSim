name: Native CUDA consumer
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: native-cuda-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: CUDA ${{ matrix.cuda }} consumer sm80
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'IAI-USTC-Quantum'
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12.8.1', '13.3.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require a QRAM main-line dependency
        run: |
          git -C extern/qram-simulator fetch --no-tags origin main
          git -C extern/qram-simulator merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Prepare independent build tools and pinned NVIDIA SDK
        run: |
          python -m pip install cmake==4.4.4 ninja==1.13.2 pybind11==3.0.2
          python extern/qram-simulator/tools/bootstrap_cuda.py --release ${{ matrix.cuda }} --output build-cuda/toolkit
      - name: Configure a real CUDA consumer without a GPU
        shell: python
        run: |
          import pathlib, subprocess, sys
          import pybind11
          nvcc = pathlib.Path('build-cuda/toolkit/prefix/bin/nvcc').resolve()
          subprocess.run(['cmake', '-S', '.', '-B', 'build-cuda/native', '-G', 'Ninja',
              '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
              '-DSPARQ_ENABLE_CUDA=ON', '-DCMAKE_CUDA_ARCHITECTURES=80',
              '-DCMAKE_CUDA_COMPILER='+str(nvcc), '-Dpybind11_DIR='+pybind11.get_cmake_dir(),
              '-DPYTHON_EXECUTABLE='+sys.executable], check=True)
      - name: Compile framework and algorithm device libraries
        run: >-
          cmake --build build-cuda/native --parallel 4 --target
          SparQ_Common_cuda SparQ_QRAMSimulator_cuda SparQ_Simulator_cuda SparQ_Algorithm_cuda
