name: Documentation

# Build the Sphinx (Python) documentation; C++ Doxygen docs live in the
# qram-simulator repository.
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'README.md'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'README.md'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Gitea 也会扫描 .github/workflows,但其 runner 访问不了 github.com → 仅 GitHub 上游执行
    if: github.repository_owner == 'IAI-USTC-Quantum'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - id: setup-python
      name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Documentation Dependencies
      run: |
        "${{ env.pythonLocation }}/bin/python" -m pip install -r docs/sphinx/requirements.txt

    - name: Build Sphinx Documentation
      run: |
        cd docs/sphinx
        make html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/sphinx/build/html/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/sphinx/build/html/
        publish_branch: gh-pages
