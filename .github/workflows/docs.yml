name: Documentation

# Build the Sphinx documentation (Python + C++ API via Doxygen/Breathe);
# the QRAM-Simulator submodule keeps its own Doxygen HTML in its repository.
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'SparQ/**'
      - 'SparQ_Algorithm/**'
      - 'README.md'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'SparQ/**'
      - 'SparQ_Algorithm/**'
      - 'README.md'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Gitea 也会扫描 .github/workflows,但其 runner 访问不了 github.com → 仅 GitHub 上游执行
    if: github.repository_owner == 'IAI-USTC-Quantum'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - id: setup-python
      name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Documentation Dependencies
      run: |
        "${{ env.pythonLocation }}/bin/python" -m pip install -r docs/sphinx/requirements.txt

    - name: Install Doxygen and pandoc
      # pandoc：nbsphinx 渲染 notebooks 必需（ubuntu runner 未预装）
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen pandoc

    # 编译 C++ 扩展并安装 pysparq，让 autoapi 能导入完整包
    # （缺 _core 时 pysparq.dynamic_operator / rir 等页面全部导入失败）
    - name: Build and install pysparq
      run: |
        "${{ env.pythonLocation }}/bin/python" -m pip install .

    - name: Build Sphinx Documentation
      run: |
        cd docs/sphinx
        make html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/sphinx/build/html/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/sphinx/build/html/
        publish_branch: gh-pages
