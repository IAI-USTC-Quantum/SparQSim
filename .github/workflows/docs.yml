name: Documentation

# Sphinx site (bilingual zh/en trees under one site):
#   1. doxygen generates XML (C++ API, ingested by Sphinx via breathe)
#   2. pip install . builds the C++ extension and installs pysparq so
#      autoapi can import the full package (without _core, the
#      dynamic_operator / rir pages fail to import)
#   3. sphinx-build builds BOTH language trees (html/zh + html/en) plus a
#      root redirect page (English by default) and deploys to gh-pages
#      (full replacement on push to main)
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'SparQ/**'
      - 'SparQ_Algorithm/**'
      - 'README.md'
      - '**.rst'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'docs/**'
      - 'PySparQ/**'
      - 'SparQ/**'
      - 'SparQ_Algorithm/**'
      - 'README.md'
      - '**.rst'
      - '**.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    # Gitea also scans .github/workflows, but its runners cannot reach github.com → run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - id: setup-python
      name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Documentation Dependencies
      run: |
        "${{ env.pythonLocation }}/bin/python" -m pip install -r docs/sphinx/requirements.txt

    - name: Install Doxygen and pandoc
      # pandoc: required by nbsphinx to render notebooks (not preinstalled on ubuntu runners)
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen pandoc

    # Build the C++ extension and install pysparq so autoapi can import the
    # full package (without _core, all pysparq.dynamic_operator / rir pages
    # fail to import)
    - name: Build and install pysparq
      run: |
        "${{ env.pythonLocation }}/bin/python" -m pip install .

    - name: Build Sphinx site (zh + en trees)
      run: |
        cd docs/sphinx
        make html

    - name: Generate root landing page (redirect, English by default)
      run: |
        printf '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<title>SparQ Documentation</title>\n<meta http-equiv="refresh" content="0; url=en/index.html">\n<link rel="canonical" href="en/index.html">\n</head>\n<body>\n<p>Redirecting to the <a href="en/index.html">English documentation</a>. <a href="zh/index.html">中文文档</a></p>\n</body>\n</html>\n' > docs/sphinx/build/html/index.html

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/sphinx/build/html/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/sphinx/build/html/
        publish_branch: gh-pages
        # Bilingual Sphinx site: fully replaces the previous single-tree site
        force_orphan: true
