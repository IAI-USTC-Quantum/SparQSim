name: Python tests

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'docs/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'docs/**'

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Gitea also scans .github/workflows, but its runner cannot reach github.com → run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.10', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # scikit-build-core uses the Ninja generator, which needs cl on PATH
    # (the bare windows runner's pwsh has no MSVC environment)
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy

    - name: Build and install package
      run: pip install -v .

    - name: Run import test
      run: python -c "import pysparq; pysparq.test_import()"

    - name: Run pytest
      # The Windows runner's Strawberry Perl ships a mingw g++: JIT compilation
      # works, but the MinGW runtime DLLs the artifact depends on
      # (libstdc++-6 etc.) are not on PATH, so ctypes loading fails.
      # JIT tests run in full in the Linux job; native JIT support on Windows
      # is deferred until dynamic_operator is adapted for it.
      run: pytest PySparQ/test/ -v ${{ runner.os == 'Windows' && '--ignore=PySparQ/test/test_dynamic_operator.py --ignore=PySparQ/test/test_doc_examples.py' || '' }}
