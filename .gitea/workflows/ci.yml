name: SparQSim CI

on:
  push:
    branches: [main, develop, "autopilot/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: sparqsim-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Build pysparq and run tests
    runs-on: ubuntu-latest

    steps:
      # 自包含步骤：runner 无法稳定访问 github.com（TLS 握手超时），
      # 因此不用 actions/checkout 与 actions/setup-python，
      # 改为直接从本 Gitea 实例克隆 + 使用系统 Python。
      # qram-simulator submodule 用相对 URL（../qram-simulator.git），
      # 在本 Gitea 实例内解析；凭据经 insteadOf 重写注入。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libgomp1 python3-dev python3-pip python3-venv python-is-python3

      - name: Check out repository with submodules
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*//}"
          git config --global url."https://${GITHUB_ACTOR}:${TOKEN}@${SERVER_HOST}/".insteadOf "https://${SERVER_HOST}/"
          git clone --recurse-submodules "https://${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: Install Python build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "PATH=$RUNNER_TEMP/venv/bin:$PATH" >> "$GITEA_ENV"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy pytest pybind11

      - name: Build and install pysparq
        env:
          CMAKE_ARGS: >-
            -DCACHED_REGISTER_SIZE=8
        run: python -m pip install .

      - name: Run Python tests
        run: python -m pytest -q PySparQ/test
