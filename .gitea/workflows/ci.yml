name: SparQSim CI

on:
  push:
    branches: [main, develop, "autopilot/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: sparqsim-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Build pysparq and run tests
    runs-on: ubuntu-latest

    steps:
      # Self-contained steps: the runner cannot reliably reach github.com
      # (TLS handshake timeouts), so we avoid actions/checkout and
      # actions/setup-python, cloning directly from this Gitea instance
      # instead and using the system Python.
      # The qram-simulator submodule uses a relative URL (../QRAM-Simulator.git),
      # which resolves within this Gitea instance; credentials are injected
      # via the insteadOf rewrite.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libgomp1 python3-dev python3-pip python3-venv python-is-python3

      - name: Check out repository with submodules
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          SERVER_HOST="${GITHUB_SERVER_URL#*//}"
          git config --global url."https://${GITHUB_ACTOR}:${TOKEN}@${SERVER_HOST}/".insteadOf "https://${SERVER_HOST}/"
          git clone --recurse-submodules "https://${SERVER_HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: Install Python build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "PATH=$RUNNER_TEMP/venv/bin:$PATH" >> "$GITEA_ENV"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install numpy pytest pybind11

      - name: Build and install pysparq
        env:
          CMAKE_ARGS: >-
            -DCACHED_REGISTER_SIZE=8
        run: python -m pip install .

      - name: Run Python tests
        run: python -m pytest -q PySparQ/test
