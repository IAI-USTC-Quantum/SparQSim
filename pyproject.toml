[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11==3.0.2",
    "setuptools>=70",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "pysparq"
dynamic = ["version"]
description = "A sparse state quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agony", email = "chenzhaoyun@iai.ustc.edu.cn" }]

dependencies = ["numpy", "typing_extensions; python_version < '3.11'"]

[project.scripts]
pysparq = "pysparq.demo:main"

[project.urls]
Core = "https://github.com/IAI-USTC-Quantum/QRAM-Simulator"

[project.optional-dependencies]
dev = ["pybind11_stubgen", "pytest"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.platlib = true
wheel.license-files = [
    "LICENSE", "THIRD_PARTY_NOTICES.md",
    "extern/qram-simulator/LICENSE",
    "extern/qram-simulator/THIRD_PARTY_NOTICES.md",
    "extern/qram-simulator/ThirdParty/notice-provenance.json",
    "extern/qram-simulator/ThirdParty/fmt/LICENSE",
    "extern/qram-simulator/ThirdParty/eigen-3.4.0/COPYING.*",
    "extern/qram-simulator/ThirdParty/argparse/LICENSE.Apache-2.0-with-LLVM-exception.txt",
    "extern/qram-simulator/ThirdParty/pybind11/LICENSE",
    "extern/qram-simulator/ThirdParty/gcc-runtime/*",
]
# wheel.packages is required WITH wheel.platlib to include Python source
# files from PySparQ/pysparq/ in the wheel alongside the compiled .so
# extensions from the CMake install prefix (platlib).
wheel.packages = {pysparq = "PySparQ/pysparq"}
ninja.make-fallback = false
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# The sdist must be self-contained (PyPI policy: no network fetches during
# build): embed the QRAM-Simulator submodule source checked out next to it,
# plus the local SparQ framework sources. Default source selection already
# traverses the initialized submodule. Do not force-include its entire directory:
# include patterns take precedence over exclusions and would bundle .git pointers.
# Remember to init submodules
# (`git submodule update --init`) before `python -m build --sdist`.
[tool.scikit-build.sdist]
exclude = [
    "/extern/qram-simulator/.git",
    "/extern/qram-simulator/.github",
    "/extern/qram-simulator/.gitea",
    "/extern/qram-simulator/docs",
    "extern/qram-simulator/Experiments",
    "extern/qram-simulator/test",
    "extern/qram-simulator/ThirdParty/googletest",
    "SparQ/test",
    # Root-anchored (leading /): gitignore-style patterns without a slash
    # match at any level and once caught PySparQ/pysparq/test by mistake (the
    # test-support module shipped in the package since 0.1.1; integration
    # tests under PySparQ/test import it from the installed package)
    "/Experiments",
    "/test",
    "/examples",
    "/docs",
    "/.gitea",
    "/.github",
]

[tool.setuptools]
# Ensure setuptools auto-discovery finds only the pysparq package, not
# C++/CMake dirs that happen to contain Python-like files.
packages = ["pysparq"]

[tool.setuptools.package-dir]
"" = "PySparQ"

# __version__ is read from dist-info at runtime (importlib.metadata) — no
# generated _version.py needed (scikit-build-core excludes gitignored files
# from wheels, which silently dropped the written file; pysparq<=0.1.1 was
# affected).
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.cibuildwheel]
build-frontend = "build[uv]"
test-requires = ["pytest==8.4.2", "numpy==2.2.6"]
test-command = 'python "{project}/tools/check_installed_product.py"'
environment = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1" }
# 32-bit systems not supported yet (size_t != uint64_t)
# macOS support temporarily removed
skip = ["*-musllinux_*", "*-win32", "*-macos*"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# cibuildwheel installs the product before test-requires. Seed the tested
# binary NumPy first so its unconstrained runtime dependency cannot select a
# future sdist that no longer supports the manylinux2014 compiler/glibc.
before-test = "uv pip install --only-binary=:all: numpy==2.2.6"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
