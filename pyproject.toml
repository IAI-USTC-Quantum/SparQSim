[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
    "setuptools>=70",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "pysparq"
dynamic = ["version"]
description = "A sparse state quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agony", email = "chenzhaoyun@iai.ustc.edu.cn" }]

dependencies = ["numpy", "typing_extensions; python_version < '3.11'"]

[project.urls]
Core = "https://github.com/IAI-USTC-Quantum/QRAM-Simulator"

[project.optional-dependencies]
dev = ["pybind11_stubgen", "pytest"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.platlib = true
# wheel.packages is required WITH wheel.platlib to include Python source
# files from PySparQ/pysparq/ in the wheel alongside the compiled .so
# extensions from the CMake install prefix (platlib).
wheel.packages = {pysparq = "PySparQ/pysparq"}
ninja.make-fallback = false
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# The sdist must be self-contained (PyPI policy: no network fetches during
# build): embed the QRAM-Simulator submodule source checked out next to it.
# Remember to init submodules (`git submodule update --init`) before
# `python -m build --sdist`.
[tool.scikit-build.sdist]
include = ["extern/qram-simulator/*"]
exclude = ["extern/qram-simulator/.git"]

[tool.setuptools]
# Ensure setuptools auto-discovery finds only the pysparq package, not
# C++/CMake dirs that happen to contain Python-like files.
packages = ["pysparq"]

[tool.setuptools.package-dir]
"" = "PySparQ"

# __version__ is read from dist-info at runtime (importlib.metadata) — no
# generated _version.py needed (scikit-build-core excludes gitignored files
# from wheels, which silently dropped the written file; pysparq<=0.1.1 was
# affected).
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.cibuildwheel]
build-frontend = "build[uv]"
# 暂不支持 32 位系统(size_t != uint64_t)
# 暂时移除 macOS 支持
skip = ["*-musllinux_*", "*-win32", "*-macos*"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "yum install -y libgomp"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
